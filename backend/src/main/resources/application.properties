spring.application.name=plant-care-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/plant_care_expo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=plantadmin
spring.datasource.password=plantpass123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.plantcare=DEBUG

# ESP32 Hardware Serial Configuration
esp32.serial.port=/dev/ttyUSB0
esp32.serial.baud-rate=9600
esp32.serial.default-plant-id=1
esp32.serial.reconnect-interval-ms=5000
esp32.serial.enabled=true

# Smart Watering Recommendation Configuration
plantcare.watering.soil-moisture-threshold=30.0
plantcare.watering.rain-lookback-hours=24
plantcare.alert.soil-moisture-threshold=30.0

# JWT Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Open-Meteo Weather Integration
weather.latitude=10.7275
weather.longitude=76.2889
weather.rain-probability-threshold=60.0
weather.cache-duration-minutes=60
weather.forecast-days-to-check=2

# OpenPlantbook Integration
openplantbook.base-url=https://open.plantbook.io/api/v1
openplantbook.client-id=${OPENPLANTBOOK_CLIENT_ID:}
openplantbook.client-secret=${OPENPLANTBOOK_CLIENT_SECRET:}
openplantbook.cache-ttl-hours=24


